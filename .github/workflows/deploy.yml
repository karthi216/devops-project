name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📦 Checkout Code
      uses: actions/checkout@v3

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: 🔐 Manual Login to GHCR
      run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u karthi216 --password-stdin

    - name: 🛠️ Build Docker Image
      run: docker build -t ghcr.io/karthi216/wisecow-k8s-deployment:latest .

    - name: 🚀 Push Docker Image
      run: docker push ghcr.io/karthi216/wisecow-k8s-deployment:latest

    - name: ☸️ Deploy to Kubernetes
      run: kubectl apply -f k8s/

    - name: ✅ Confirm Deployment
      run: |
        kubectl get pods
        kubectl get svc
        kubectl get ingress


