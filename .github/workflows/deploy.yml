name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📦 Checkout Code
      uses: actions/checkout@v3

    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: karthi216
        password: ${{ secrets.GHCR_PAT }}

    - name: 🛠️ Build Docker Image
      run: |
        echo "🔧 Building Docker image..."
        docker build -t ghcr.io/karthi216/wisecow-k8s-deployment:latest .

    - name: 🚀 Push Docker Image
      run: |
        echo "📤 Pushing Docker image to GHCR..."
        docker push ghcr.io/karthi216/wisecow-k8s-deployment:latest

    - name: ☸️ Deploy to Kubernetes
      run: |
        echo "📦 Applying Kubernetes manifests..."
        kubectl apply -f k8s/

    - name: ✅ Confirm Deployment
      run: |
        echo "🔍 Checking deployment status..."
        kubectl get pods
        kubectl get svc
        kubectl get ingress

    - name: ❌ Catch Failure
      if: failure()
      run: echo "❌ Deployment failed. Check logs above for details."